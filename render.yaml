# Temporary public demo only. It seeds fictional data and uses ephemeral local
# storage. Never use this service for real employee, payroll, or biometric data.
services:
  - type: web
    name: peoplework-hrms-demo
    runtime: node
    plan: free
    # NODE_ENV is production at runtime, but Vite/TypeScript are needed to
    # compile the frontend during the build phase.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: peoplework-hrms-demo-db
          property: connectionString

databases:
  - name: peoplework-hrms-demo-db
    plan: free
    databaseName: peoplework_demo
    user: peoplework_demo_user
