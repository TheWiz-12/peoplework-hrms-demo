# Temporary public demo only. It seeds fictional data and uses ephemeral local
# storage. Never use this service for real employee, payroll, or biometric data.
services:
  - type: web
    name: peoplework-hrms-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_EMBEDDED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
